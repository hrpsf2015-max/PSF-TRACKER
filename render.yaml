# Render Blueprint: web service + PostgreSQL. Check Render's current free-tier terms before using.
services:
  - type: web
    name: psf-payment-tracker
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: psf-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false   # you will be asked to type this in the Render dashboard
databases:
  - name: psf-db
    plan: free
